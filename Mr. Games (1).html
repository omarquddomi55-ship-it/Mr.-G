<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Games</title>
<style>
:root{--bg:#0b0b0c;--fg:#f5f5f5;--card:#171717;--ac:#ff7a00;--mu:#a1a1a1;--bd:#2c2c2c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:480px;margin:0 auto;padding:6px 16px 40px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:20px;margin:0 0 8px}
p{margin:6px 0 14px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
textarea{width:100%;min-height:150px;border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--fg)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:13px 14px;width:100%;margin:5px 0;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
button:hover{border-color:var(--ac);background:#221a12;box-shadow:0 0 0 2px rgba(255,122,0,.25)}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;border-color:var(--bd);background:var(--card)}
button.p{background:linear-gradient(135deg,#ff9a2e,#ff6a00);color:#111;border-color:#ff7a00;font-weight:700}
button.p:hover{background:linear-gradient(135deg,#ffab4d,#ff7a00);box-shadow:0 4px 16px rgba(255,122,0,.45)}
button.p:disabled{background:var(--card);color:var(--mu)}
.big{font-size:34px;text-align:center;margin:18px 0;font-weight:700}
.dead{opacity:.45;text-decoration:line-through}
.tag{display:inline-block;font-size:13px;color:var(--ac)}
.row{display:flex;gap:8px}.row button{width:auto;margin:0;padding:0 18px}
input{flex:1;min-width:0;font:inherit;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
input:focus{border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#221a12;border:1px solid #5a3410;border-radius:999px;padding:6px 8px 6px 14px;animation:pop .18s}
.chip b{cursor:pointer;width:22px;height:22px;border-radius:50%;background:#2c2c2c;display:inline-flex;align-items:center;justify-content:center;font-weight:400;transition:background .15s,color .15s}
.chip b:hover{background:var(--ac);color:#111}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.cnt{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);margin-top:12px}.cnt span:first-child{color:var(--ac)}
.vrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.vrow .num{width:26px;height:26px;border-radius:50%;background:#221a12;color:var(--ac);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.vrow .nm{flex:1}
.vrow button{width:42px;height:42px;padding:0;margin:0;font-size:22px;line-height:1}
.vc{min-width:30px;text-align:center;font-size:22px;color:var(--ac)}
.warn{color:var(--ac);font-weight:700}
.hb{width:auto;padding:8px 14px;margin:0 0 14px;font-size:14px}
button.g{display:flex;align-items:center;gap:14px;text-align:right;padding:14px 16px;margin:9px 0}
.gi{font-size:30px;min-width:46px;text-align:center}
button.g small{color:var(--mu)}
button.g:hover{transform:translateY(-2px)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid3.g4{grid-template-columns:repeat(4,1fr)}
.cell{height:84px;font-size:34px;font-weight:700;padding:0;margin:0}
.cell.X{color:var(--ac)}.cell.up{background:#221a12;border-color:var(--ac)}
h1{color:var(--ac)}
button{position:relative;overflow:hidden}
button::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,122,0,.6),transparent 70%);opacity:0;transform:scale(.3);transition:opacity .4s,transform .4s;pointer-events:none}
button:active::after{opacity:1;transform:scale(1.8);transition:0s}
button:active:not(:disabled){transform:scale(.92);border-color:var(--ac);background:#2a1d10}
button.p:active:not(:disabled){background:#ff7a00;box-shadow:0 0 22px rgba(255,122,0,.7)}
button.g{text-align:start;min-height:104px;padding:20px 20px;gap:20px;margin:14px 0;border-radius:20px;border-width:2px}
.gi{font-size:56px;min-width:70px;line-height:1}
button.g b{font-size:22px}
button.g small{font-size:15px;line-height:1.5}
.big.sm{font-size:22px;line-height:1.5}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:fin .3s}
.ovl button{max-width:300px}
.oe{font-size:160px;line-height:1.1;animation:pp .7s cubic-bezier(.2,1.6,.4,1)}
.ovl h2{font-size:36px;color:var(--ac);margin:10px 0 20px}
@keyframes fin{from{opacity:0}}
@keyframes pp{from{transform:scale(0) rotate(-25deg)}}

button.bomb{width:200px;height:200px;border-radius:50%;margin:24px auto;display:block;font-size:24px}
.splash{text-align:center;padding-top:0}.logo{font-size:76px;animation:bob 1.6s ease-in-out infinite}.ttl{font-size:46px;margin:6px 0 4px}
@keyframes bob{50%{transform:translateY(-12px) rotate(-6deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.logo{animation:none}
.say2{position:relative;display:inline-block;background:#fff;color:#111;border:3px solid var(--ac);border-radius:18px;padding:10px 20px;margin-bottom:18px;left:40px;font-size:19px;font-weight:700;line-height:1.5;animation:pop3 .55s cubic-bezier(.2,1.5,.4,1) .3s both}
.say2::before,.say2::after{content:'';position:absolute;left:50%;margin-left:-51px;border:11px solid transparent;border-bottom:0}
.say2::after{bottom:-14px;border-top-color:var(--ac)}
.say2::before{bottom:-9px;border-top-color:#fff;z-index:1}
@keyframes pop3{from{opacity:0;transform:scale(.4) translateY(10px)}}
.c4b{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;background:#1d140b;border:2px solid var(--ac);border-radius:16px;margin:12px 0}
.c4c{aspect-ratio:1;border-radius:50%;background:#0b0b0c;box-shadow:inset 0 3px 6px rgba(0,0,0,.8);cursor:pointer;transition:transform .1s}
.c4c:active{transform:scale(.88)}
.c4c.R{background:radial-gradient(circle at 35% 30%,#ffb35a,#ff7a00 60%,#c45a0c)}
.c4c.Y{background:radial-gradient(circle at 35% 30%,#fff,#e8e8e8 60%,#b0b0b0)}
.c4c.new{animation:drp .35s}
@keyframes drp{from{transform:translateY(-140px);opacity:0}}
h3{margin:0 0 10px;font-size:17px;color:var(--ac)}
.hh{width:100%;text-align:center;direction:ltr;font-size:clamp(40px,15vw,72px);line-height:1.1;margin:4px 0 6px;letter-spacing:1px;text-shadow:0 4px 18px rgba(255,122,0,.35)}
.hh+p{text-align:center}
main>button:not(.g):not(.hb):not(.bomb),.card>button{min-height:66px;font-size:20px;font-weight:700;border-radius:18px;margin:10px 0}
.splash button{min-height:68px;font-size:22px;font-weight:700;border-radius:18px}
.ovl button{min-height:66px;font-size:20px;font-weight:700}
.row button{height:60px;font-size:22px;padding:0 24px;min-width:64px}
input{padding:16px 14px;font-size:18px}
.chip{font-size:17px;padding:8px 10px 8px 16px}
.vrow button{width:54px;height:54px}
.vc{font-size:30px;min-width:40px}
.ovl .say2{left:0;font-size:24px;max-width:90vw;margin-bottom:22px}
.say2.big b{display:block;color:var(--ac);font-size:30px;margin-top:4px}
.ovl .ch{margin-bottom:12px}
.cell{height:auto;aspect-ratio:1;font-size:clamp(36px,12vw,56px)}
.gi svg{width:64px;height:64px;display:block;border-radius:16px;box-shadow:0 4px 12px rgba(255,122,0,.3)}
.ch{display:block;margin:0 auto;max-width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);filter:drop-shadow(0 6px 16px rgba(255,122,0,.28))}
.mc{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transform-origin:50% 100%}
.mc.hop{animation:hop .55s}
@keyframes hop{30%{transform:translateY(-22px) scale(.97,1.05)}60%{transform:translateY(0) scale(1.05,.94)}100%{transform:none}}
.bd{transform-origin:160px 350px;animation:br 3s ease-in-out infinite}
@keyframes br{50%{transform:scaleY(1.018)}}
.hd{transform-origin:166px 170px;animation:tilt 4s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
.wv{transform-origin:58px 268px;animation:wv 5s ease-in-out infinite}
.hop .wv{animation-duration:.8s}
@keyframes wv{0%,40%,100%{transform:rotate(0)}6%{transform:rotate(14deg)}12%{transform:rotate(-10deg)}18%{transform:rotate(14deg)}24%{transform:rotate(-10deg)}30%{transform:rotate(12deg)}35%{transform:rotate(0)}}
.ir{transition:transform .12s}
.m2{display:none}.hp .m1{display:none}.hp .m2{display:block}
.bub{opacity:0;transform-origin:248px 24px}
.say .bub{animation:say 2.2s forwards}
@keyframes say{0%{opacity:0;transform:scale(.5)}10%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var ROLE={mafia:"مافيا 🔪",doc:"طبيب 💉",det:"محقق 🕵️",cit:"مواطن 👤"};
var LANG='ar',BT,NAMES=[],P=[],S={scr:'splash'},app=document.getElementById("app");
function esc(t){return String(t).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function alive(){return P.map(function(p,i){return i}).filter(function(i){return P[i].alive})}
function cnt(r){return P.filter(function(p){return p.alive&&p.role===r}).length}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function go(s,x){S=Object.assign({scr:s,round:S.round,night:S.night},x||{});render()}
function start(){
  var n=NAMES.slice();
  if(n.length<4)return;
  var m=Math.max(1,Math.floor(n.length/4)),r=[];
  for(var i=0;i<m;i++)r.push("mafia");
  r.push("doc");if(n.length>=6)r.push("det");
  while(r.length<n.length)r.push("cit");
  shuffle(r);P=n.map(function(x,i){return{name:x,role:r[i],alive:true}});
  S={round:1,night:{}};go("reveal",{i:0,shown:false});
}
function win(){
  var m=cnt("mafia"),o=alive().length-m;
  if(m===0)return"المواطنون 🎉";
  if(m>=o)return"المافيا 🔪";
  return null;
}
function checkWin(next){var w=win();if(w)go("end",{w:w});else next()}
function list(ids,fn,cls){
  return ids.map(function(i){return'<button onclick="'+fn+'('+i+')">'+esc(P[i].name)+'</button>'}).join("");
}
function render(){
  var h="",s=S.scr;
  if(s==="splash")h=splashH();else if(s==="home")h=homeH();else if(s==="tod")h=todH();else if(s==="wyr")h=wyrH();else if(s==="bomb")h=bombH();else if(s==="xo")h=S.ai===undefined?modeH(0):xoH();else if(s==="inv")h=invH();else if(s==="spy")h=spyH();else if(s==="mem")h=memH();else if(s==="c4")h=S.ai===undefined?modeH(1):c4H();else if(s==="stg")h=stgH();else if(s==="setup"){
    var c=NAMES.length,mm=Math.max(1,Math.floor(c/4));
    h='<h1>🎭 مافيا</h1><p>أضف اللاعبين، وأنا بوزّع الأدوار وبدير الليل والنهار.</p><div class="card"><div class="row"><input id="nm" maxlength="20" autocomplete="off" placeholder="اسم اللاعب" onkeydown="if(event.key===\'Enter\')addName()"><button class="p" onclick="addName()">+ إضافة</button></div>'
    +'<div class="chips">'+NAMES.map(function(n,i){return'<span class="chip">'+esc(n)+'<b onclick="delName('+i+')" title="حذف">×</b></span>'}).join("")+'</div>'
    +'<div class="cnt"><span>'+c+' لاعب'+(c<4?' · تحتاج '+(4-c)+' على الأقل':'')+'</span>'+(c>=4?'<span>مافيا: '+mm+(c>=5?' · طبيب':'')+(c>=6?' · محقق':'')+'</span>':'')+'</div></div>'
    +(c?'<button onclick="NAMES=[];render()">مسح الكل</button>':'')
    +'<button class="p" onclick="start()" '+(c<4?'disabled':'')+'>ابدأ اللعبة</button>';
  }else if(s==="reveal"){
    var p=P[S.i];
    h='<div class="card"><h2>الدور '+(S.i+1)+' من '+P.length+'</h2><p>أعطِ الجهاز إلى:</p><div class="big">'+esc(p.name)+'</div>';
    if(!S.shown)h+='<button class="p" onclick="S.shown=true;render()">اكشف دوري (سرّاً)</button>';
    else{
      h+='<div class="big">'+ROLE[p.role]+'</div>';
      if(p.role==="mafia"){var mates=P.filter(function(q,j){return q.role==="mafia"&&j!==S.i}).map(function(q){return q.name});if(mates.length)h+='<p>شركاؤك: '+esc(mates.join("، "))+'</p>'}
      h+='<button class="p" onclick="nextReveal()">خبّي وكمّل</button>';
    }
    h+='</div>';
  }else if(s==="night"){
    var steps=[
      {k:"mafia",t:"المافيا 🔪",say:"المافيا يفتحوا عيونهم ويتفقوا على ضحية.",ids:alive().filter(function(i){return P[i].role!=="mafia"})},
      {k:"doc",t:"الطبيب 💉",say:"الطبيب يفتح عيونه ويختار مين ينقذ.",ids:alive()},
      {k:"det",t:"المحقق 🕵️",say:"المحقق يفتح عيونه ويختار مين يشك فيه.",ids:alive().filter(function(i){return P[i].role!=="det"})}
    ];
    var st=steps[S.step];
    h='<div class="tag">الجولة '+S.round+' · الليل 🌙</div>';
    if(S.step===0&&!S.started){
      h+='<div class="card"><h2>الليل نزل</h2><p>قل للجميع: «أغمضوا عيونكم».</p><button class="p" onclick="S.started=true;render()">ابدأ الليل</button></div>';
    }else if(S.res!==undefined){
      h+='<div class="card"><h2>نتيجة التحقيق</h2><div class="big">'+esc(S.res)+'</div><p>أشِر للمحقق بإبهامك (فوق = مافيا، تحت = لا).</p><button class="p" onclick="endNight()">انتهى الليل</button></div>';
    }else{
      var exists=alive().some(function(i){return P[i].role===st.k});
      h+='<div class="card"><h2>'+st.t+'</h2><p>'+st.say+'</p>';
      if(!exists)h+='<p>هذا الدور خرج من اللعبة. انتظر بضع ثوانٍ ثم تابع حتى لا يعرف أحد.</p><button class="p" onclick="stepDone()">تابع</button>';
      else h+=list(st.ids,"pick")+(st.k==="mafia"?"":'<button onclick="stepDone()">لا أحد / تخطي</button>');
      h+='</div>';
    }
  }else if(s==="morning"){
    var k=S.killed;
    h='<div class="tag">الجولة '+S.round+' · الصباح ☀️</div><div class="card"><h2>صباح الخير</h2><p>الجميع يفتح عيونه.</p>';
    h+=k===null?'<div class="big">ما مات أحد الليلة 🎉</div>':'<div class="big">قُتل: '+esc(P[k].name)+'</div><p>دوره كان: '+ROLE[P[k].role]+'</p>';
    h+='<button class="p" onclick="checkWin(function(){go(\'day\')})">كمّل للنقاش</button></div>';
  }else if(s==="day"){
    h='<div class="tag">الجولة '+S.round+' · النهار 🗳️</div><div class="card"><h2>النقاش والتصويت</h2><p>اضغط + عند اللاعب لكل صوت يحصل عليه. مجموع الأصوات: '+totV()+' / '+alive().length+'</p>'+tieMsg()+voteRows()+'<button class="p" onclick="confirmVote()" '+(totV()?'':'disabled')+'>تأكيد التصويت</button><button onclick="skipVote()">ما في إقصاء</button></div><p>الأحياء: '+alive().length+'</p>';
  }else if(s==="out"){
    h='<div class="card"><h2>تم الإقصاء</h2><div class="big">'+esc(P[S.who].name)+'</div><p>كان: '+ROLE[P[S.who].role]+'</p><button class="p" onclick="checkWin(newNight)">ابدأ الليل التالي</button></div>';
  }else if(s==="end"){
    h='<div class="card"><h2>انتهت اللعبة</h2><div class="big">فاز '+S.w+'</div><p>الأدوار:</p>'+P.map(function(p){return'<div class="'+(p.alive?"":"dead")+'">'+esc(p.name)+' — '+ROLE[p.role]+'</div>'}).join("")+'</div><button class="p" onclick="S={scr:\'setup\'};render()">لعبة جديدة</button>';
  }
  app.innerHTML=(s==="splash"?"":s==="home"?'<button class="hb" onclick="stg()" aria-label="settings" style="font-size:22px;padding:6px 12px">⚙️</button>':'<button class="hb" onclick="navBack()">← رجوع</button>')+h;
}
function homeH(){
 var g=[["🎭","مافيا","حكم رقمي لليل والنهار","S={scr:'setup'}"],["❌⭕","إكس أو","لاعبان أو ضد الكمبيوتر","S={scr:'xo'}"],['🔴',LL(['أربعة في صف','Connect Four']),LL(['اسقط القطع واصنع صفاً من أربعة','Drop discs and line up four']),'c4Mode()'],['🎲',LL(['حقيقة أو تحدّي','Truth or Dare']),LL(['أسئلة وتحديات للشلّة','Questions and dares for the group']),'g(0)'],['🤔',LL(['لو خيّروك','Would You Rather']),LL(['خيارات صعبة ونقاش','Tough choices to debate']),'wyrGo()'],['💣',LL(['القنبلة','The Bomb']),LL(['مرّروا الجهاز قبل الانفجار','Pass the phone before it blows']),'g(1)'],["🕵️","برّا السالفة","اكتشف مَن لا يعرف الكلمة","S={scr:'spy',n:5,ph:'set'}"],["🧠","الذاكرة","اقلب البطاقات وطابقها","memNew()"]];
 return'<h1 class=hh>Mr. Games</h1><p>اختر لعبتك</p>'+g.map(function(x){return'<button class="g" onclick="'+x[3]+';render()"><span class="gi">'+ico(x[0])+'</span><span><b>'+x[1]+'</b><br><small>'+x[2]+'</small></span></button>'}).join("");
}
var L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function xoWin(b){for(var i=0;i<8;i++){var l=L[i];if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return b[l[0]]}return b.every(Boolean)?"d":null}
function xoNew(ai,keep){S={scr:"xo",b:Array(9).fill(""),t:"X",ai:ai,sc:keep?S.sc:{X:0,O:0}};render()}
function xoMove(i){S.b[i]=S.t;S.w=xoWin(S.b);if(S.w){if(S.w!=="d")S.sc[S.w]++}else S.t=S.t==="X"?"O":"X"}
function xoAI(){var e=[],b=S.b,m=-1;b.forEach(function(v,i){if(!v)e.push(i)});
 ["O","X"].forEach(function(p){if(m<0)e.forEach(function(i){if(m<0){b[i]=p;if(xoWin(b)===p)m=i;b[i]=""}})});
 if(m<0||Math.random()<.6)m=e[Math.floor(Math.random()*e.length)];xoMove(m)}
function xoPlay(i){if(S.b[i]||S.w||S.lock)return;xoMove(i);render();if(!S.w&&S.ai&&S.t==="O"){var s=S;s.lock=1;setTimeout(function(){if(S===s){xoAI();s.lock=0;render()}},700)}}
function xoH(){

function c4New(ai,keep){S={scr:'c4',b:Array(42).fill(''),t:'R',ai:ai,sc:keep?S.sc:{R:0,Y:0}};render()}

function c4Row(b,c){for(var r=5;r>=0;r--)if(!b[r*7+c])return r;return -1}
function c4Chk(b){var D=[[0,1],[1,0],[1,1],[1,-1]];for(var r=0;r<6;r++)for(var c=0;c<7;c++){var p=b[r*7+c];if(!p)continue;for(var k=0;k<4;k++){var n=1;while(n<4){var rr=r+D[k][0]*n,cc=c+D[k][1]*n;if(rr<0||rr>5||cc<0||cc>6||b[rr*7+cc]!==p)break;n++}if(n===4)return p}}return b.every(Boolean)?'d':null}
function c4Put(c){var i=c4Row(S.b,c)*7+c;S.b[i]=S.t;S.last=i;S.w=c4Chk(S.b);if(S.w){if(S.w!=='d')S.sc[S.w]++}else S.t=S.t==='R'?'Y':'R'}
function c4AI(){var b=S.b,cols=[],m=-1;for(var c=0;c<7;c++)if(c4Row(b,c)>=0)cols.push(c);['Y','R'].forEach(function(p){if(m<0)cols.forEach(function(c){if(m<0){var i=c4Row(b,c)*7+c;b[i]=p;if(c4Chk(b)===p)m=c;b[i]=''}})});if(m<0||Math.random()<.5)m=cols[Math.floor(Math.random()*cols.length)];c4Put(m)}
